<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ F1 直播助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117; color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #e10600 0%, #ff4b4b 100%);
            padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center;
        }
        .header h1 { color: white; font-size: 1.8em; margin-bottom: 5px; }
        .header p { color: rgba(255,255,255,0.9); font-size: 1em; }
        .watch-section {
            background: #161b22; border-radius: 12px; padding: 20px; margin-bottom: 20px;
            text-align: center;
        }
        .watch-btn {
            display: inline-block; background: #e10600; color: white; padding: 15px 40px;
            border-radius: 8px; text-decoration: none; font-size: 1.2em; font-weight: 600;
            margin: 10px; transition: all 0.3s;
        }
        .watch-btn:hover { background: #ff4b4b; transform: translateY(-2px); }
        .schedule-section { background: #161b22; border-radius: 12px; padding: 20px; }
        .schedule-section h2 { color: #e10600; margin-bottom: 15px; font-size: 1.3em; }
        .race-card {
            background: #0d1117; border-radius: 8px; padding: 15px; margin-bottom: 12px;
            border-left: 4px solid #30363d; transition: all 0.3s;
        }
        .race-card.next { border-left-color: #e10600; background: #1c2128; }
        .race-card .race-name { font-size: 1.1em; font-weight: 600; margin-bottom: 8px; }
        .race-card .race-location { color: #8b949e; font-size: 0.9em; margin-bottom: 8px; }
        .race-card .events { display: flex; flex-wrap: wrap; gap: 8px; }
        .event-tag {
            background: #21262d; padding: 4px 10px; border-radius: 4px; font-size: 0.85em;
            border: 1px solid #30363d;
        }
        .event-tag.sprint { border-color: #ff9800; color: #ff9800; }
        .event-tag.qualifying { border-color: #4caf50; color: #4caf50; }
        .event-tag.race { border-color: #e10600; color: #e10600; }
        .countdown { color: #8b949e; font-size: 0.9em; margin-top: 8px; }
        .countdown.next { color: #e10600; font-weight: 600; }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.3em; }
            .watch-btn { padding: 12px 30px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏎️ F1 2026 直播助手</h1>
            <p>实时赛程 + 一键观看直播</p>
        </div>

        <div class="watch-section">
            <h2 style="color: #e6edf3; margin-bottom: 15px;">📺 观看直播</h2>
            <a href="https://www.jrs15.com/wlty.html" target="_blank" class="watch-btn">
                🎬 打开纬来体育直播
            </a>
            <p style="color: #8b949e; margin-top: 10px; font-size: 0.9em;">
                点击按钮将在新窗口打开直播页面<br>
                如无法播放，请尝试使用 Chrome 或 Safari 浏览器
            </p>
        </div>

        <div class="schedule-section">
            <h2>📅 F1 2026 剩余赛程</h2>
            <div id="race-list"></div>
        </div>
    </div>

    <script>
        // F1 2026 赛程数据
        const races = [

            },
            {

            },
            {

                is_sprint: true,
                sprint_qualifying_bj: "2026-08-21 02:30",
                sprint_bj: "2026-08-21 22:00",
                qualifying_bj: "2026-08-22 21:00",
                race_bj: "2026-08-23 20:00"
            },
            {
                round: 16, name: "意大利大奖赛", location: "Monza, Italy",

            },
            {

                is_sprint: false,
                qualifying_bj: "2026-09-19 21:00",
                race_bj: "2026-09-20 20:00"
            },
            {
                round: 18, name: "阿塞拜疆大奖赛", location: "Baku, Azerbaijan",
                is_sprint: false,
                qualifying_bj: "2026-10-03 20:00",
                race_bj: "2026-10-04 19:00"
            },
            {
                round: 19, name: "新加坡大奖赛", location: "Marina Bay, Singapore",
                is_sprint: true,
                sprint_qualifying_bj: "2026-10-16 17:30",
                sprint_bj: "2026-10-17 16:00",
                qualifying_bj: "2026-10-17 21:00",
                race_bj: "2026-10-18 20:00"
            },
            {
                round: 20, name: "美国大奖赛", location: "Austin, USA",
                is_sprint: false,
                qualifying_bj: "2026-10-24 04:00",
                race_bj: "2026-10-25 03:00"
            },
            {
                round: 21, name: "墨西哥大奖赛", location: "Mexico City, Mexico",
                is_sprint: false,

                race_bj: "2026-11-02 03:00"
            },
            {
                round: 22, name: "巴西大奖赛", location: "São Paulo, Brazil",
                is_sprint: true,
                sprint_qualifying_bj: "2026-11-13 03:30",
                sprint_bj: "2026-11-13 23:00",
                qualifying_bj: "2026-11-14 04:00",

            },
            {
                round: 23, name: "拉斯维加斯大奖赛", location: "Las Vegas, USA",
                is_sprint: false,
                qualifying_bj: "2026-11-21 13:00",
                race_bj: "2026-11-22 12:00"
            },
            {
                round: 24, name: "卡塔尔大奖赛", location: "Lusail, Qatar",
                is_sprint: true,
                sprint_qualifying_bj: "2026-12-05 22:30",
                sprint_bj: "2026-12-06 20:00",
                qualifying_bj: "2026-12-06 02:00",
                race_bj: "2026-12-07 00:00"
            },
            {
                round: 25, name: "阿布扎比大奖赛", location: "Yas Marina, UAE",
                is_sprint: false,
                qualifying_bj: "2026-12-12 21:00",
                race_bj: "2026-12-13 20:00"
            }
        ];

        function convertToBeijing(utcTime) {
            return new Date(utcTime);
        }

        function formatCountdown(targetTime) {
            const now = new Date();
            const diff = targetTime - now;
            
            if (diff < 0) return null;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (days > 0) return `还有 ${days} 天 ${hours} 小时`;
            if (hours > 0) return `还有 ${hours} 小时 ${minutes} 分钟`;
            return `还有 ${minutes} 分钟`;
        }

        function renderRaces() {
            const raceList = document.getElementById('race-list');
            const now = new Date();
            let nextRaceFound = false;
            
            races.forEach(race => {
                const card = document.createElement('div');
                card.className = 'race-card';
                
                let eventsHtml = '';
                const events = [];
                
                if (race.sprint_qualifying_bj) {
                    events.push({ type: 'sprint-qualifying', name: '冲刺排位赛 ⚡', time: race.sprint_qualifying_bj });
                }
                if (race.qualifying_bj) {
                    events.push({ type: 'qualifying', name: '排位赛 🏆', time: race.qualifying_bj });
                }
                if (race.is_sprint && race.sprint_bj) {
                    events.push({ type: 'sprint', name: '冲刺赛 ⚡', time: race.sprint_bj });
                }
                if (race.race_bj) {
                    events.push({ type: 'race', name: '正赛 🏁', time: race.race_bj });
                }
                
                events.forEach(event => {
                    const eventTime = new Date(event.time);
                    const countdown = formatCountdown(eventTime);
                    const tagClass = event.type.includes('sprint') ? 'sprint' : 
                                     event.type === 'qualifying' ? 'qualifying' : 'race';
                    
                    eventsHtml += `<div class="event-tag ${tagClass}">${event.name} | ${eventTime.toLocaleDateString('zh-CN')} ${eventTime.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})}</div>`;
                    
                    if (!nextRaceFound && countdown) {
                        card.classList.add('next');
                        nextRaceFound = true;
                    }
                });
                
                const sprintMark = race.is_sprint ? ' <span style="color: #ff9800;">⚡冲刺周末</span>' : '';
                
                card.innerHTML = `
                    <div class="race-name">R${race.round} - ${race.name}${sprintMark}</div>
                    <div class="race-location">📍 ${race.location}</div>
                    <div class="events">${eventsHtml}</div>
                `;
                
                raceList.appendChild(card);
            });
        }

        renderRaces();
        setInterval(() => {
            location.reload();
        }, 60000);
    </script>
</body>
</html>

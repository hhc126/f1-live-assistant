name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        run: |
          chmod +x gradlew
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          ln -sf /tmp/gradle-8.5/bin/gradle /usr/local/bin/gradle

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: F1-Live-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
